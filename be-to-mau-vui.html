    <style>
      :root{
        --ink:#22304a;
        --card:#ffffff;
        --sky:#dff4ff;
        --sky2:#fff3c4;
        --accent:#ff6b81;
        --accent2:#ffb020;
        --good:#22c55e;
        --shadow:0 6px 0 rgba(34,48,74,.12), 0 18px 34px rgba(34,48,74,.14);
        --radius:26px;
      }
      *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
      html,body{ margin:0; padding:0; }
      body{
        font-family:"Baloo 2","Comic Sans MS","Chalkboard SE",ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;
        color:var(--ink);
        background:
          radial-gradient(circle at 12% 20%, #ffffff 0 26px, transparent 27px),
          radial-gradient(circle at 88% 12%, #ffffff 0 18px, transparent 19px),
          radial-gradient(circle at 80% 85%, #ffffff 0 30px, transparent 31px),
          linear-gradient(180deg, var(--sky) 0%, #eaf9ff 45%, var(--sky2) 130%);
        min-height:100dvh;
        overflow-x:hidden;
      }
      button{ font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }
      button:focus-visible{ outline:4px solid #007aff; outline-offset:2px; }

      .wrap{ max-width:540px; margin:0 auto; padding:14px 14px 34px; }

      /* ---------- Header ---------- */
      header{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:4px 2px 10px; }
      .title{ display:flex; align-items:center; gap:10px; min-width:0; }
      .title .crayon{
        width:52px; height:52px; flex:0 0 auto; border-radius:16px;
        background:#fff; box-shadow:var(--shadow);
        display:flex; align-items:center; justify-content:center; font-size:30px;
        transform:rotate(-6deg);
      }
      h1{ font-size:clamp(24px,6.4vw,32px); line-height:1.05; margin:0; font-weight:800; letter-spacing:.2px; }
      h1 .w1{ color:#ff4757; } h1 .w2{ color:#ff9500; } h1 .w3{ color:#0aa84f; } h1 .w4{ color:#007aff; }
      .music-btn{
        width:56px; height:56px; flex:0 0 auto; border-radius:50%;
        background:#fff; box-shadow:var(--shadow); font-size:26px;
        display:flex; align-items:center; justify-content:center;
        border:3px solid #ffe1e7;
      }
      .music-btn.off{ filter:grayscale(.7); opacity:.65; }
      .music-btn:active{ transform:scale(.93); }

      /* ---------- Picture picker ---------- */
      .picker{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin:6px 0 14px; }
      .pick{
        background:#fff; border-radius:20px; border:3px solid transparent;
        box-shadow:0 4px 0 rgba(34,48,74,.10), 0 10px 20px rgba(34,48,74,.08);
        padding:9px 2px 7px; min-height:74px;
        display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
        transition:transform .15s ease, border-color .15s ease;
      }
      .pick .emo{ font-size:32px; line-height:1.1; }
      .pick .nm{ font-size:14px; font-weight:700; }
      .pick:active{ transform:scale(.94); }
      .pick.sel{ border-color:var(--accent); transform:scale(1.05) rotate(-1.5deg); background:#fff5f6; }
      .pick .done-badge{ font-size:12px; height:14px; line-height:1; }

      /* ---------- Stage: lớp vẽ dưới, lớp nét trên ---------- */
      .stage-card{
        position:relative; background:var(--card); border-radius:var(--radius);
        box-shadow:var(--shadow); padding:12px; border:4px solid #fff;
      }
      .stage{ position:relative; border-radius:18px; overflow:hidden;
        background:
          radial-gradient(circle at 85% 12%, #ffe9a8 0 20px, transparent 21px),
          linear-gradient(180deg,#f4fbff, #ffffff);
      }
      .stage canvas{
        display:block; width:100%; height:auto; position:relative; z-index:1;
        touch-action:none; cursor:crosshair; user-select:none; -webkit-user-select:none;
      }
      .stage .lines{ position:absolute; inset:0; z-index:2; pointer-events:none; }
      .stage .lines svg{ display:block; width:100%; height:100%; }
      .detail{ pointer-events:none; }

      /* Linh vật mèo góc tranh */
      .mascot{
        position:absolute; right:6px; bottom:2px; width:76px; height:76px; z-index:4;
        pointer-events:none; filter:drop-shadow(0 3px 3px rgba(34,48,74,.18));
      }
      .mascot .eye{ transform-box:fill-box; transform-origin:center; animation:blink 4.6s infinite; }
      @keyframes blink{ 0%,91%,100%{ transform:scaleY(1); } 94%,97%{ transform:scaleY(.08); } }
      .mascot .mouth-happy{ display:none; }
      .stage.happy .mascot{ animation:bob .5s ease-in-out infinite alternate; }
      .stage.happy .mascot .mouth-happy{ display:block; }
      .stage.happy .mascot .mouth-calm{ display:none; }
      @keyframes bob{ from{ transform:translateY(0) rotate(-2deg); } to{ transform:translateY(-4px) rotate(2deg); } }

      .progress{ display:flex; align-items:center; gap:10px; margin:12px 2px 0; }
      .progress .bar{ flex:1; height:18px; border-radius:99px; background:#e8eef7; overflow:hidden; box-shadow:inset 0 2px 4px rgba(34,48,74,.12); }
      .progress .fillbar{ height:100%; width:0%; border-radius:99px; background:repeating-linear-gradient(45deg,#22c55e 0 14px,#4ade80 14px 28px); transition:width .35s ease; }
      .progress .txt{ font-size:16px; font-weight:800; white-space:nowrap; }

      .finish-btn{
        width:100%; margin-top:12px; min-height:66px; border-radius:22px;
        background:linear-gradient(180deg,#ffb020,#ff9500); color:#fff;
        font-size:24px; font-weight:900; letter-spacing:.3px;
        box-shadow:0 6px 0 #d98e00, 0 14px 24px rgba(255,149,0,.35);
        text-shadow:0 2px 2px rgba(0,0,0,.18);
        transition:transform .12s ease;
      }
      .finish-btn:active{ transform:scale(.96) translateY(3px); box-shadow:0 2px 0 #d98e00; }

      /* ---------- Chọn cỡ cọ ---------- */
      .brushes{
        margin-top:14px; background:#fff; border-radius:var(--radius); box-shadow:var(--shadow);
        padding:10px 12px; display:flex; align-items:center; gap:10px;
      }
      .brushes .lbl{ font-size:17px; font-weight:900; white-space:nowrap; }
      .brush-opt{
        flex:1; min-height:56px; border-radius:16px; background:#eef3fb;
        display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
        font-size:14px; font-weight:800; border:3px solid transparent;
        transition:transform .12s ease;
      }
      .brush-opt .dot{ border-radius:50%; background:var(--ink); display:block; }
      .brush-opt:active{ transform:scale(.94); }
      .brush-opt.sel{ border-color:var(--accent); background:#fff5f6; }

      /* ---------- Palette ---------- */
      .palette{
        margin-top:14px; background:#fff; border-radius:var(--radius); box-shadow:var(--shadow);
        padding:12px; display:grid; grid-template-columns:repeat(6,1fr); gap:10px;
      }
      .swatch{
        aspect-ratio:1/1; width:100%; min-height:48px; border-radius:50%;
        border:4px solid rgba(34,48,74,.10);
        box-shadow:inset 0 -6px 0 rgba(0,0,0,.14), 0 3px 0 rgba(34,48,74,.12);
        transition:transform .12s ease;
        position:relative; overflow:hidden;
      }
      .swatch:active{ transform:scale(.9); }
      .swatch.sel{ border-color:var(--ink); transform:scale(1.14) rotate(-4deg); z-index:1; }
      .swatch.sel::after{ content:"✓"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#fff; font-size:22px; font-weight:900; text-shadow:0 2px 3px rgba(0,0,0,.45); }
      .swatch.special{ font-size:20px; display:flex; align-items:center; justify-content:center; }
      .swatch.rainbow-bg{ background:conic-gradient(#ff3b30,#ff9500,#ffcc00,#34c759,#007aff,#af52de,#ff3b30); }
      .swatch.glitter-bg{ background:radial-gradient(circle at 30% 30%, #fff6c9, #ffd60a 55%, #f5b800); }

      /* ---------- Tools ---------- */
      .tools{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:14px; }
      .tool{
        min-height:64px; border-radius:20px; background:#fff; box-shadow:0 4px 0 rgba(34,48,74,.12), 0 10px 18px rgba(34,48,74,.08);
        display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
        font-size:14px; font-weight:800; padding:8px 2px;
        transition:transform .12s ease, opacity .15s ease;
      }
      .tool .ic{ font-size:26px; line-height:1.1; }
      .tool:active{ transform:scale(.93); }
      .tool.eraser.on{ background:#ffe1e7; box-shadow:0 4px 0 #ff6b81, 0 10px 18px rgba(34,48,74,.10); }
      .tool.save{ background:#dcf7e5; }
      .tool:disabled{ opacity:.4; }

      .hint{ text-align:center; font-size:15px; font-weight:700; color:#5a6b8c; margin:14px 6px 0; }

      /* ---------- Sparkles & confetti ---------- */
      .spark{ position:absolute; pointer-events:none; font-size:20px; z-index:5;
        animation:sparkFly .65s ease-out forwards; text-shadow:0 2px 4px rgba(0,0,0,.2); }
      @keyframes sparkFly{
        0%{ transform:translate(-50%,-50%) scale(.4) rotate(0deg); opacity:1; }
        100%{ transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.25) rotate(120deg); opacity:0; }
      }
      .confetti{ position:fixed; top:-16px; z-index:60; pointer-events:none; border-radius:3px;
        animation:confFall var(--dur) ease-in forwards; }
      @keyframes confFall{
        0%{ transform:translateY(0) rotate(0deg); opacity:1; }
        100%{ transform:translateY(105vh) rotate(var(--rot)); opacity:.9; }
      }

      /* ---------- Celebration overlay ---------- */
      .overlay{
        position:fixed; inset:0; z-index:50; display:none;
        align-items:center; justify-content:center; padding:20px;
        background:rgba(34,48,74,.45);
      }
      .overlay.show{ display:flex; }
      .praise{
        background:#fff; border-radius:30px; box-shadow:var(--shadow);
        padding:28px 22px 22px; text-align:center; max-width:360px; width:100%;
        animation:pop .35s cubic-bezier(.2,1.6,.4,1);
      }
      @keyframes pop{ from{ transform:scale(.7); opacity:0; } to{ transform:scale(1); opacity:1; } }
      .praise .stars{ font-size:44px; letter-spacing:4px; }
      .praise h2{ margin:8px 0 4px; font-size:32px; font-weight:900; color:#ff4757; }
      .praise p{ margin:0 0 18px; font-size:17px; font-weight:700; color:#5a6b8c; }
      .praise .row{ display:flex; gap:10px; }
      .praise button{
        flex:1; min-height:58px; border-radius:18px; font-size:17px; font-weight:900;
      }
      .praise .again{ background:#eef3fb; }
      .praise .go-next{ background:var(--accent2); box-shadow:0 4px 0 #d98e00; }
      .praise button:active{ transform:scale(.95); }

      .toast{
        position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(80px);
        background:var(--ink); color:#fff; font-weight:800; font-size:16px;
        padding:12px 22px; border-radius:99px; z-index:70; opacity:0; transition:all .3s ease;
        pointer-events:none; white-space:nowrap;
      }
      .toast.show{ transform:translateX(-50%) translateY(0); opacity:1; }

      @media (prefers-reduced-motion: reduce){
        .spark,.confetti{ animation-duration:.01s; }
        .praise{ animation:none; }
        .mascot .eye{ animation:none; }
        .stage.happy .mascot{ animation:none; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div class="title">
          <div class="crayon" aria-hidden="true">🖍️</div>
          <h1><span class="w1">Bé</span> <span class="w2">Tô</span> <span class="w3">Màu</span> <span class="w4">Vui</span></h1>
        </div>
        <button class="music-btn" id="musicBtn" aria-label="Bật hoặc tắt nhạc" title="Nhạc">🎵</button>
      </header>

      <nav class="picker" id="picker" aria-label="Chọn tranh"></nav>

      <section class="stage-card">
        <div class="stage" id="stage">
          <canvas id="paint" width="800" height="800" aria-label="Vùng tô màu"></canvas>
          <div class="lines" id="lines"></div>
          <svg class="mascot" id="mascot" viewBox="0 0 100 100" aria-hidden="true">
            <polygon points="18,34 26,8 46,24" fill="#ffb020" stroke="#22304a" stroke-width="4" stroke-linejoin="round"/>
            <polygon points="82,34 74,8 54,24" fill="#ffb020" stroke="#22304a" stroke-width="4" stroke-linejoin="round"/>
            <polygon points="23,30 28,16 40,25" fill="#ff8fab"/>
            <polygon points="77,30 72,16 60,25" fill="#ff8fab"/>
            <circle cx="50" cy="56" r="36" fill="#ffd60a" stroke="#22304a" stroke-width="4"/>
            <ellipse class="eye" cx="36" cy="50" rx="5" ry="7" fill="#22304a"/>
            <ellipse class="eye" cx="64" cy="50" rx="5" ry="7" fill="#22304a"/>
            <circle cx="27" cy="64" r="6" fill="#ff8fab" opacity=".75"/>
            <circle cx="73" cy="64" r="6" fill="#ff8fab" opacity=".75"/>
            <polygon points="45,60 55,60 50,66" fill="#ff6b81"/>
            <path class="mouth-calm" d="M42 70 Q50 76 58 70" fill="none" stroke="#22304a" stroke-width="3.5" stroke-linecap="round"/>
            <path class="mouth-happy" d="M40 68 Q50 82 60 68 Q50 74 40 68 Z" fill="#ff6b81" stroke="#22304a" stroke-width="3" stroke-linejoin="round"/>
            <path d="M6 56 L20 60 M8 70 L21 68 M94 56 L80 60 M92 70 L79 68" stroke="#22304a" stroke-width="3" stroke-linecap="round" fill="none"/>
          </svg>
        </div>
        <div class="progress">
          <div class="bar"><div class="fillbar" id="fillbar"></div></div>
          <div class="txt" id="progTxt">Đã tô: 0%</div>
        </div>
        <button class="finish-btn" id="finishBtn">🏆 Hoàn thành!</button>
      </section>

      <section class="brushes" aria-label="Chọn cỡ cọ">
        <span class="lbl">🖌️ Cọ:</span>
        <button class="brush-opt" data-brush="0" aria-label="Cọ nhỏ"><span class="dot" style="width:10px;height:10px"></span>Nhỏ</button>
        <button class="brush-opt" data-brush="1" aria-label="Cọ vừa"><span class="dot" style="width:18px;height:18px"></span>Vừa</button>
        <button class="brush-opt" data-brush="2" aria-label="Cọ to"><span class="dot" style="width:28px;height:28px"></span>To</button>
      </section>

      <section class="palette" id="palette" aria-label="Bảng màu"></section>

      <section class="tools">
        <button class="tool eraser" id="eraserBtn" aria-label="Tẩy"><span class="ic">🧽</span>Tẩy</button>
        <button class="tool" id="undoBtn" aria-label="Hoàn tác nét vừa tô"><span class="ic">↩️</span>Hoàn tác</button>
        <button class="tool" id="resetBtn" aria-label="Làm lại tranh"><span class="ic">↺</span>Làm lại</button>
        <button class="tool save" id="saveBtn" aria-label="Lưu tranh"><span class="ic">💾</span>Lưu tranh</button>
        <button class="tool" id="prevBtn" aria-label="Tranh trước"><span class="ic">⬅️</span>Trước</button>
        <button class="tool" id="nextBtn" aria-label="Tranh sau"><span class="ic">➡️</span>Sau</button>
      </section>

      <p class="hint">👆 Chọn một màu, rồi quẹt ngón tay lên tranh để tô như bút sáp nhé!</p>
    </div>

    <div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="Khen bé">
      <div class="praise">
        <div class="stars" aria-hidden="true">⭐⭐⭐</div>
        <h2>Bé giỏi quá!</h2>
        <p>Bé đã tô xong bức tranh rồi! 🎉</p>
        <div class="row">
          <button class="again" id="againBtn">🎨 Tô tiếp</button>
          <button class="go-next" id="goNextBtn">➡️ Tranh mới</button>
        </div>
      </div>
    </div>

    <div class="toast" id="toast">Đã lưu tranh! 💾</div>

    <script>
      "use strict";
      /* ============================================================
         BÉ TÔ MÀU VUI — bé chọn màu rồi TỰ TÔ bằng cọ (kéo là vẽ)
         2 lớp: canvas màu của bé ở dưới, nét đen SVG ở trên.

          '<circle class="detail" cx="90" cy="176" r="4" fill="#fff"/>' +
          '<path class="detail" d="M52 214 Q66 224 52 234" fill="none" stroke="#22304a" stroke-width="4" stroke-linecap="round"/>'

        { id:"chim", name:"Chim", emo:"🐦", svg: R(
          '<polygon class="region" points="272,246 356,224 344,288 268,286"/>' +

        undoStack.push(canvas.toDataURL("image/png"));
        if (undoStack.length > 25) undoStack.shift();
        syncUndo();
        clearCanvas();
        delete state.done[currentPic().id];
        popSound(); updateProgress(); scheduleSave(); renderPickerDoneOnly();
        showToast("Đã làm lại tranh! 🎨");
      });
      document.getElementById("finishBtn").addEventListener("click", function () {
        saveCurrentPaint();
        state.done[currentPic().id] = true;
        persist(); renderPickerDoneOnly();
        celebrate();
      });
      function goPic(dir) {
        saveCurrentPaint();
        state.pic = (state.pic + dir + PICTURES.length) % PICTURES.length;
        state.eraser = false; eraserBtn.classList.remove("on");
        undoStack = []; syncUndo();
        popSound(); persist(); renderPicker(); loadPicture();
        stageEl.scrollIntoView({ behavior: "smooth", block: "center" });
      }
      document.getElementById("nextBtn").addEventListener("click", function () { goPic(1); });
      document.getElementById("prevBtn").addEventListener("click", function () { goPic(-1); });
      document.getElementById("goNextBtn").addEventListener("click", function () {
        overlayEl.classList.remove("show"); stageEl.classList.remove("happy"); goPic(1);
      });
      document.getElementById("againBtn").addEventListener("click", function () {
        overlayEl.classList.remove("show"); stageEl.classList.remove("happy"); popSound();
      });

      /* Lưu tranh thành ảnh PNG tải về máy: ghép lớp vẽ + lớp nét */
      document.getElementById("saveBtn").addEventListener("click", function () {
        var p = currentPic();
        var out = document.createElement("canvas");
        out.width = 800; out.height = 800;
        var octx = out.getContext("2d");
        octx.fillStyle = "#FFFFFF"; octx.fillRect(0, 0, 800, 800);
        octx.drawImage(canvas, 0, 0, 800, 800);
        var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="800" height="800">' +
          '<g fill="none" stroke="#22304a" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">' + p.svg + "</g></svg>";
        var url = URL.createObjectURL(new Blob([svg], { type: "image/svg+xml;charset=utf-8" }));
        var img = new Image();
        img.onload = function () {
          octx.drawImage(img, 0, 0, 800, 800);
          URL.revokeObjectURL(url);
          out.toBlob(function (blob) {
            if (!blob) return;
            var a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = "tranh-" + p.id + "-cua-be.png";
            document.body.appendChild(a); a.click(); a.remove();
            setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
            showToast("Đã lưu tranh! 💾");
          }, "image/png");
        };
        img.src = url;
      });

      /* Nhạc bật/tắt */
      function syncMusicBtn() {
        musicBtn.textContent = state.music ? "🎵" : "🔇";
        musicBtn.classList.toggle("off", !state.music);
      }
      musicBtn.addEventListener("click", function () {
        state.music = !state.music;
        persist(); syncMusicBtn();
        if (state.music) startMusic(); else stopMusic();
      });

      var toastTimer = null;
      function showToast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { toastEl.classList.remove("show"); }, 1800);
      }

      /* Chạm đầu tiên: mở khoá âm thanh trên điện thoại */
      document.addEventListener("pointerdown", function once() {
        audio(); startMusic();
        document.removeEventListener("pointerdown", once);
      });

      /* ---------- Khởi động ---------- */
      syncMusicBtn();
      syncUndo();
      renderBrushes();
      renderPicker();
      renderPalette();
      loadPicture();
    </script>
  </body>
</html>
